name: Build Neko Void ISO labwc

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-neko-void:
    name: Build ISOs
    runs-on: ubuntu-latest

    container:
      image: 'ghcr.io/void-linux/void-mklive:20250116R1'
      options: --privileged
      volumes:
        - /dev:/dev
      env:
        PATH: '/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/sbin:/usr/local/bin:/tmp/bin'

    steps:
      - name: Prepare container, system users and dependencies
        shell: sh
        run: |
          xbps-install -Syu --repository=https://repo-de.voidlinux.org/current/ xbps
          xbps-install -yu  --repository=https://repo-de.voidlinux.org/current/
          xbps-install -y  --repository=https://repo-de.voidlinux.org/current/ git bash wget curl file sudo python3 python3-pip rsync openssh
          python3 -m pip install -U "huggingface_hub[cli]" --break-system-packages

          groupadd -g 1000 anon
          useradd -m -u 1000 -g anon -s /bin/bash anon
          echo "anon ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/anon

      - name: Clone Neko Void repository
        run: |
          mkdir -p /home/anon/workspace
          chown -R anon:anon /home/anon/workspace
          su - anon -c "git clone --depth 1 https://codeberg.org/Neko-Void/Build-Neko.git /home/anon/workspace"

      - name: Build Neko-Void ISO Xorg
        run: |
          cd /home/anon/workspace/live-maker

          BUILD=labwc
          mkdir -p $BUILD/etc/pam.d
          cat << 'EOFPAM' > $BUILD/etc/pam.d/lightdm-autologin
          #%PAM-1.0
          auth      required  pam_env.so
          auth      required  pam_permit.so
          account   include   system-login
          password  include   system-login
          session   include   system-login
          EOFPAM
          chmod 644 $BUILD/etc/pam.d/lightdm-autologin
          if [ -d "./$BUILD/home/anon" ]; then
            chown -R anon:anon "./$BUILD/home/anon"
            chmod 755 "./$BUILD/home/anon"
          fi


          rm -f ./includedir/home/anon/.Xauthority
          rm -f ./includedir/home/anon/.ICEauthority

          chmod 1777 /tmp
          chmod 1777 /var/tmp

          # Compilación real de la ISO
          su anon -c "bash neko-builder.sh labwc"

      - name: Generate Checksums
        run: |
          cd /home/anon/workspace
          sha256sum **/*.iso > 'sha256sum.txt' || true

      - name: Upload ISO to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          ISO_FILE=$(find /home/anon/workspace -name "*.iso" | head -n 1)
          ISO_NAME=$(basename "$ISO_FILE")

          hf upload arepaconcafe/untested-neko "$ISO_FILE" "$ISO_NAME" --repo-type dataset --token $HF_TOKEN
          hf upload arepaconcafe/untested-neko /home/anon/workspace/sha256sum.txt "${ISO_FILE}-sha256.txt" --repo-type dataset --token $HF_TOKEN

      - name: Upload ISO to SourceForge
        env:
          SF_USER: ${{ secrets.SF_USER }}
          SF_PROJECT: ${{ secrets.SF_PROJECT }}
          SF_SSH_KEY_B64: ${{ secrets.SF_SSH_KEY_B64 }}
        run: |
          # Usar una ruta absoluta explícita para evitar conflictos de variables de entorno
          echo "$SF_SSH_KEY_B64" | base64 -d > /tmp/sf_key
          chmod 600 /tmp/sf_key
          
          # Escanear el host y guardarlo en una ruta absoluta
          mkdir -p /tmp/.ssh
          ssh-keyscan -H frs.sourceforge.net >> /tmp/.ssh/known_hosts
          
          ISO_FILE=$(find /home/anon/workspace -name "*.iso" | head -n 1)
          
          if [ -n "$ISO_FILE" ]; then
            echo "Subiendo $ISO_FILE a SourceForge..."
            # Inyectar las rutas absolutas al cliente SSH
            rsync -av --partial --timeout=120 -e "ssh -i /tmp/sf_key -o UserKnownHostsFile=/tmp/.ssh/known_hosts -o StrictHostKeyChecking=no" "$ISO_FILE" "${SF_USER}@frs.sourceforge.net:/home/frs/project/${SF_PROJECT}/isos/"
          else
            echo "Error: No se encontró ningún archivo ISO para subir a SourceForge."
            exit 1
          fi
