name: Build Neko Void ISO ICE-JWM

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-neko-void:
    name: Build ISOs
    runs-on: ubuntu-latest

    container:
      image: 'ghcr.io/void-linux/void-mklive:20250116R1'
      options: --privileged
      volumes:
        - /dev:/dev
      env:
        PATH: '/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/sbin:/usr/local/bin:/tmp/bin'

    steps:
      - name: Prepare container, system users and dependencies
        shell: sh
        run: |
          xbps-install -Syu xbps
          xbps-install -yu
          xbps-install -y git bash wget curl file sudo python3 python3-pip
          python3 -m pip install -U "huggingface_hub[cli]" --break-system-packages

          groupadd -g 1000 anon
          useradd -m -u 1000 -g anon -s /bin/bash anon
          echo "anon ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/anon

      - name: Clone Neko Void repository
        run: |
          mkdir -p /home/anon/workspace
          chown -R anon:anon /home/anon/workspace
          su - anon -c "git clone --depth 1 https://codeberg.org/javiercplus/Neko-Void.git /home/anon/workspace"

      - name: Build Neko-Void ISO Xorg
        run: |
          cd /home/anon/workspace/live-maker

          # 1. PERMISOS SEGUROS (No destruir binarios de MATE)
          su - anon -c "
            cd /home/anon/workspace/live-maker

            # Asegurar que los directorios sean navegables
            find includedir -type d -exec chmod 755 {} \;

            # Quitar permiso de ejecución SOLO a archivos de texto/configuración conocidos
            # Esto evita romper binarios como mate-session, xorg, etc.
            find includedir -type f \( -name '*.conf' -o -name '*.txt' -o -name '*.md' -o -name '*.json' -o -name '*.xml' -o -name '*.desktop' -o -name '*.list' -o -name '*.cfg' -o -name '*.png' -o -name '*.jpg' -o -name '*.svg' \) -exec chmod 644 {} \;

            # Restaurar permisos de ejecución para los scripts del sistema
            find includedir -type f -name \"run\" -exec chmod +x {} \;
            find includedir -type f -name \"*.sh\" -exec chmod +x {} \;

            if [ -d \"./includedir/home/anon\" ]; then
              chmod 755 ./includedir/home/anon
            fi
          "

          # 2. Configurar Autologin en LightDM
          mkdir -p includedir/etc/lightdm/lightdm.conf.d
          cat << 'EOF' > includedir/etc/lightdm/lightdm.conf.d/neko-autologin.conf
          [Seat:*]
          greeter-session=lightdm-gtk-greeter
          user-session=mate
          autologin-user=anon
          autologin-user-timeout=0
          EOF
          chmod 644 includedir/etc/lightdm/lightdm.conf.d/neko-autologin.conf

          # 3. BY-PASS TOTAL DE PAM (Soluciona el bloqueo del grupo autologin)
          # Al usar pam_permit.so, PAM permitirá el inicio de sesión sin contraseña
          # y sin requerir que el usuario pertenezca a ningún grupo especial.
          mkdir -p includedir/etc/pam.d
          cat << 'EOFPAM' > includedir/etc/pam.d/lightdm-autologin
          #%PAM-1.0
          auth required pam_permit.so
          account required pam_permit.so
          password required pam_permit.so
          session required pam_permit.so
          EOFPAM
          chmod 644 includedir/etc/pam.d/lightdm-autologin

          # 4. Re-alineación final de propietarios
          if [ -d "./includedir/home/anon" ]; then
            chown -R anon:anon "./includedir/home/anon"
            chmod 755 "./includedir/home/anon"
          fi

          rm -f ./includedir/home/anon/.Xauthority
          rm -f ./includedir/home/anon/.ICEauthority

          chmod 1777 /tmp
          chmod 1777 /var/tmp

          # 5. Compilación real de la ISO
          bash neko-builder.sh icejwm

      - name: Generate Checksums
        run: |
          cd /home/anon/workspace
          sha256sum **/*.iso > sha256sum.txt || true

      - name: Upload ISO to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          ISO_FILE=$(find /home/anon/workspace -name "*.iso" | head -n 1)
          ISO_NAME=$(basename "$ISO_FILE")

          hf upload arepaconcafe/untested-neko "$ISO_FILE" "$ISO_NAME" --repo-type dataset --token $HF_TOKEN
          hf upload arepaconcafe/untested-neko /home/anon/workspace/sha256sum.txt "icejwm-sha256.txt" --repo-type dataset --token $HF_TOKEN
