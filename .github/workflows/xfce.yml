name: Build Neko Void ISO xfce

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-neko-void:
    name: Build ISOs
    runs-on: ubuntu-latest

    container:
      image: 'ghcr.io/void-linux/void-mklive:20250116R1'
      options: --privileged
      volumes:
        - /dev:/dev
      env:
        PATH: '/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/sbin:/usr/local/bin:/tmp/bin'

    steps:
      - name: Prepare container, system users and dependencies
        shell: sh
        run: |
          xbps-install -Syu xbps
          xbps-install -yu
          xbps-install -y git bash wget curl file sudo python3 python3-pip
          python3 -m pip install -U "huggingface_hub[cli]" --break-system-packages

          groupadd -g 1000 anon
          useradd -m -u 1000 -g anon -s /bin/bash anon
          echo "anon ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/anon

      - name: Clone Neko Void repository
        run: |
          mkdir -p /home/anon/workspace
          chown -R anon:anon /home/anon/workspace
          su - anon -c "git clone --depth 1 https://codeberg.org/javiercplus/Neko-Void.git /home/anon/workspace"

      - name: Build Neko-Void ISO Xorg
        run: |
          cd /home/anon/workspace/live-maker
          BUILD="/home/anon/workspace/live-maker/xfce"

          # Crear directorios
          mkdir -p "$BUILD/etc/pam.d"
          mkdir -p "$BUILD/etc/polkit-1/rules.d"
          mkdir -p "$BUILD/etc/lightdm"

          # Configuración limpia de PAM (se remueve pam_sepermit que es para SELinux)
          cat << 'EOF' > "$BUILD/etc/pam.d/lightdm-autologin"
          #%PAM-1.0
          auth     required    pam_permit.so
          account  required    pam_permit.so
          password required    pam_deny.so
          session  required    pam_loginuid.so
          session  required    pam_limits.so
          -session optional    pam_elogind.so
          session  required    pam_env.so
          EOF
          sed -i 's/^[ \t]*//' "$BUILD/etc/pam.d/lightdm-autologin"

          # 3. Regla de Polkit para evitar ventanas emergentes vacías
          cat << 'EOF' > "$BUILD/etc/polkit-1/rules.d/49-nopasswd_global.rules"
          /* Permitir que los administradores ejecuten acciones de polkit sin contraseña */
          polkit.addRule(function(action, subject) {
              if (subject.isInGroup("wheel")) {
                  return polkit.Result.YES;
              }
          });
          EOF
          sed -i 's/^[ \t]*//' "$BUILD/etc/polkit-1/rules.d/49-nopasswd_global.rules"

          # Asegurar permisos correctos
          chmod 644 "$BUILD/etc/lightdm/lightdm.conf"
          chmod 644 "$BUILD/etc/pam.d/lightdm-autologin"
          chmod 644 "$BUILD/etc/polkit-1/rules.d/49-nopasswd_global.rules"

          chmod 1777 /tmp
          chmod 1777 /var/tmp
          #dotfile
          rm -rf xfce/etc/skel/.config
          rm -rf xfce/home/anon/.config
          wget https://huggingface.co/datasets/arepaconcafe/untested-neko/resolve/main/xfce.tar
          tar -xf xfce.tar -C xfce/home/anon/
          tar -xf xfce.tar -C xfce/etc/skel/
          
          # Ejecutar la compilación real
          chown -R anon:anon /home/anon/workspace
          bash neko-builder.sh xfce

      - name: Generate Checksums
        run: |
          cd /home/anon/workspace
          sha256sum **/*.iso > sha256sum.txt || true

      - name: Upload ISO to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          ISO_FILE=$(find /home/anon/workspace -name "*.iso" | head -n 1)
          ISO_NAME=$(basename "$ISO_FILE")

          hf upload arepaconcafe/untested-neko "$ISO_FILE" "$ISO_NAME" --repo-type dataset --token $HF_TOKEN
          hf upload arepaconcafe/untested-neko /home/anon/workspace/sha256sum.txt "xfce-sha256.txt" --repo-type dataset --token $HF_TOKEN