# Usa pactl para ujustar el audio de pulseaudio
bindsym XF86AudioRaiseVolume exec --no-startup-id ~/.local/bin/sys_control.sh volume +10% && $refresh_i3status
bindsym XF86AudioLowerVolume exec --no-startup-id ~/.local/bin/sys_control.sh volume -10% && $refresh_i3status
bindsym XF86AudioMute exec --no-startup-id ~/.local/bin/sys_control.sh mute && $refresh_i3status
bindsym XF86AudioMicMute exec --no-startup-id ~/.local/bin/sys_control.sh mic_mute && $refresh_i3status

# iniciar una terminal
bindsym $mod+Return exec kitty

# matar ventana enfocada
bindsym $mod+q kill

# iniciar dmenu (un lanzador de programas)
bindsym $mod+p exec --no-startup-id dmenu_run

# cambiar de enfoque
bindsym $alt+F1 focus left
bindsym $alt+F2 focus right

# mover ventana enfocada
bindsym $alt+$mod+F1 move left
bindsym $alt+$mod+F2 move right

# alternativamente, puedes usar las teclas del cursor:
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# alternativamente, puedes usar las teclas del cursor:
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# dividir en orientación horizontal
bindsym $mod+t split h

# dividir en orientación vertical
bindsym $mod+y split v

# ingresa al modo de pantalla completa para el contenedor enfocado
bindsym $mod+f fullscreen toggle

# cambiar el diseño del contenedor (apilado, con pestañas, alternar división)
bindsym $mod+Ctrl+t layout tabbed
bindsym $mod+Ctrl+e layout toggle split


# alternar mosaico/flotante
bindsym $mod+Shift+space floating toggle

# alternar bordes de ventana en tiempo real (ventana enfocada)
bindsym $mod+b border toggle

# alternar bordes globalmente (todas las ventanas + nuevas)
bindsym $mod+Shift+n exec --no-startup-id ~/.local/bin/toggle_borders.sh


# cambiar el enfoque entre ventanas en mosaico/flotantes
bindsym $mod+space focus mode_toggle

# recargar el archivo de configuración
bindsym $mod+Shift+c reload
# reinicie i3 in su lugar (conserva su diseño/sesión, puede usarse para actualizar i3)
bindsym $mod+Shift+r restart
# salir de i3 (cierra sesión en tu sesión X)
bindsym $mod+Shift+L exec "i3-nagbar -t warning -m 'You pressed the exit shortcut. Do you really want to exit i3? This will end your X session.' -B 'Yes, exit i3' 'i3-msg exit'"

# cambiar el tamaño de la ventana (también puedes usar el mouse para eso)
mode "resize" {
        # These bindings trigger as soon as you enter the resize mode

        bindsym j resize shrink width 10 px or 10 ppt
        bindsym k resize grow height 10 px or 10 ppt
        bindsym l resize shrink height 10 px or 10 ppt
        bindsym ntilde resize grow width 10 px or 10 ppt

        # same bindings, but for the arrow keys
        bindsym Left resize shrink width 10 px or 10 ppt
        bindsym Down resize grow height 10 px or 10 ppt
        bindsym Up resize shrink height 10 px or 10 ppt
        bindsym Right resize grow width 10 px or 10 ppt

        # back to normal: Enter or Escape or $mod+r
        bindsym Return mode "kitty"
        bindsym Escape mode "default"
        bindsym $mod+r mode "default"
}

bindsym $mod+r mode "resize"

# Screenshots
bindsym Ctrl+Print exec --no-startup-id  maim --format=png ~/screenshots/screenshot-$(date -u +'%Y%m%d-%H%M%SZ')-all.png
bindsym $mod+Ctrl+Print exec --no-startup-id maim --format=png --window $(xdotool getactivewindow) ~/screenshots/screenshot-$(date -u +'%Y%m%d-%H%M%SZ')-current.png
bindsym Shift+Print exec --no-startup-id maim --noopengl --format=png --select ~/screenshots/screenshot-$(date -u +'%Y%m%d-%H%M%SZ')-selected.png
## Clipboard Screenshots
bindsym Print exec --no-startup-id maim /tmp/screenshot.png && ~/.local/bin/xic /tmp/screenshot.png && rm /tmp/screenshot.png
bindsym $mod+Print exec --no-startup-id maim --window $(xdotool getactivewindow) /tmp/screenshot.png && ~/.local/bin/xic /tmp/screenshot.png && rm /tmp/screenshot.png
bindsym $mod+Shift+S exec --no-startup-id maim --hidecursor --capturebackground --select /tmp/screenshot.png && ~/.local/bin/xic /tmp/screenshot.png && rm /tmp/screenshot.png
#rofi
bindsym $mod+d exec bash ~/.config/rofi/bin/launch.sh
bindsym $mod+w exec $dots_cmd $current_env
bindsym $mod+Ctrl+w exec $dots_cmd $current_env live
bindsym $mod+Shift+w exec $dots_cmd $current_env wallpaper --manage
bindsym $mod+$alt+w exec $dots_cmd $current_env wallpaper --presets-only

bindsym $mod+Shift+b exec $dots_cmd $current_env bar --select
bindsym $mod+Shift+m exec $dots_cmd $current_env bar --manage
bindsym $mod+Shift+d exec $dots_cmd $current_env display
bindsym $mod+x exec "rofi -show run";
bindsym $mod+Tab exec $dots_cmd $current_env powermenu
bindsym $mod+h exec --no-startup-id $dots_cmd $current_env show_cheatsheet.sh
bindsym $mod+Ctrl+b exec --no-startup-id ~/.local/bin/toggle_autohide.sh
bindsym $mod+Shift+t exec --no-startup-id ~/.local/bin/recolor_folders --menu
bindsym $mod+n exec --no-startup-id ~/.local/bin/network_dmenu




#brillo
bindsym XF86MonBrightnessUp exec --no-startup-id ~/.local/bin/sys_control.sh brightness +1%
bindsym XF86MonBrightnessDown exec --no-startup-id ~/.local/bin/sys_control.sh brightness 1%-
bindsym $mod+shift+F12 exec --no-startup-id ~/.local/bin/sys_control.sh brightness +1%
bindsym $mod+shift+F11 exec --no-startup-id ~/.local/bin/sys_control.sh brightness 1%-

#Audio control
bindsym $mod+F10 exec --no-startup-id ~/.local/bin/sys_control.sh mute
bindsym $mod+F11 exec --no-startup-id ~/.local/bin/sys_control.sh volume -1%
bindsym $mod+F12 exec --no-startup-id ~/.local/bin/sys_control.sh volume +1%

# mic toggle
bindsym $mod+bar exec --no-startup-id ~/.local/bin/sys_control.sh mic_mute && $refresh_i3status



bindsym $mod+E exec $file_manager
