[module/rofi]
type=custom/text
format = ${vars.launcher-icon}
format-font = ${vars.rofi-font}
format-foreground=${vars.rofi-fg}
format-background=${vars.rofi-bg}
format-underline=${vars.rofi-underline}
click-left= bash ~/.config/rofi/bin/launch.sh
click-right= bash $dots_cmd $current_env powermenu

[module/i3]
type = internal/i3
enable-scroll = false
show-urgent = true
strip-wsnumbers = false
index-sort = true
enable-click = true
fuzzy-match = true

format = <label-state> <label-mode>
label-mode = %mode%
label-mode-padding = 10px
label-mode-background = ${colors.red} 
label-mode-foreground = ${colors.white0}

label-focused = " %name% "
label-focused-foreground = ${vars.focused-fg}
label-focused-background= ${vars.focused-bg}
label-focused-underline = ${vars.focused-underline}
label-focused-padding = ${vars.label-padding}

label-unfocused = " %name% "
label-unfocused-foreground = ${colors.foreground}
label-unfocused-underline = ${colors.background-alt}
label-unfocused-padding = ${vars.label-padding}

label-visible = " %name% "
label-visible-underline = ${colors.background-alt}
label-visible-padding = ${vars.label-padding}

label-urgent = " %name% "
label-urgent-foreground = ${colors.red}
label-urgent-background= ${vars.background}
label-urgent-underline = ${colors.red}
label-urgent-padding = ${vars.label-padding}

label-separator = ""

[module/xwindow]
type = internal/xwindow
format-prefix=󰍹
format-prefix-font = 5
format-prefix-padding = 1
format-prefix-foreground=${vars.prefix-fg}
format-prefix-background=${vars.prefix-bg}
label = " %class% "
label-maxlen=60
label-foreground = ${colors.foreground}
label-underline=${colors.green}

[module/time]
type = internal/date
interval = 1
format-prefix = ${vars.icon-date}
format-prefix-font = 5
format-prefix-padding = 1
format-prefix-foreground=${vars.prefix-fg}
format-prefix-background=${vars.prefix-bg}
date = %A %d %b | %H:%M
label = " %date% " 
label-foreground = ${colors.foreground}
label-underline=${colors.primary}

[module/filesystem]
type = internal/fs
interval = 2
mount-0 = /
format-mounted-prefix = ${vars.icon-disk}
format-mounted-prefix-font = 5
format-mounted-prefix-padding = 1
format-mounted-prefix-foreground = ${vars.prefix-fg}
format-mounted-prefix-background= ${vars.prefix-bg}
label-mounted = " %free% "
label-mounted-foreground = ${colors.foreground}
label-mounted-underline = ${colors.green}

[module/cpu]
type = internal/cpu
interval = 1
format-prefix = ${vars.icon-cpu}
format-prefix-font = 5
format-prefix-padding = 1
format-prefix-foreground = ${vars.prefix-fg}
format-prefix-background= ${vars.prefix-bg}
label = " %percentage%% "
label-foreground = ${colors.foreground}
label-underline = ${colors.green}

[module/temp]
type = internal/temperature
interval = 0.5
hwmon-path = ${env:HWMON_PATH}
base-temperature = 20 
warn-temperature = 70
units = true
format = <label>
format-prefix = ${vars.icon-temp}
format-prefix-font = 5
format-prefix-padding = 1
format-prefix-foreground= ${vars.prefix-fg}
format-prefix-background= ${vars.prefix-bg}
label = " %temperature-c% "
label-foreground = ${colors.foreground}
label-underline = ${colors.green}

format-warn = <label-warn>
format-warn-prefix = ${vars.icon-temp}
format-warn-prefix-font = 5
format-warn-prefix-padding = 1
format-warn-prefix-foreground = ${colors.background-solid}
format-warn-prefix-background = ${colors.red}
label-warn = " %temperature-c% "
label-warn-foreground = ${colors.foreground}
label-warn-underline = ${colors.red}

[module/memory]
type = internal/memory
interval = 1 
format-prefix = ${vars.icon-ram}
format-prefix-font = 5
format-prefix-padding = 1
format-prefix-foreground = ${vars.prefix-fg}
format-prefix-background= ${vars.prefix-bg}
label = " %mb_used% "
label-foreground = ${colors.foreground}
label-underline = ${colors.green}

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = ${vars.icon-vol}
format-volume-prefix-font = 5
format-volume-prefix-padding = 1
format-volume-prefix-foreground = ${vars.prefix-fg}
format-volume-prefix-background= ${vars.prefix-bg}
format-volume = <label-volume>
label-volume = " %percentage%% "
label-volume-foreground= ${colors.foreground}
label-volume-underline = ${colors.secondary}

format-muted-prefix = 󰝟
format-muted-prefix-font = 5
format-muted-prefix-padding = 1
format-muted-prefix-foreground = ${vars.prefix-fg}
format-muted-prefix-background = ${vars.prefix-bg}
label-muted = " muted "
label-muted-foreground = ${colors.orange}
label-muted-underline = ${colors.orange}

[module/tray]
type=internal/tray
format = <tray>
tray-size = 75%
tray-spacing= 10px
format-padding=8px

[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = ${env:BAR_BATTERY:BAT0}
adapter = ${env:BAR_ADAPTER:AC}
poll-interval = 5

format-charging = <animation-charging><label-charging>
label-charging = " %percentage%% "
label-charging-foreground = ${colors.foreground}
label-charging-underline = ${colors.green}

format-discharging = <ramp-capacity><label-discharging>
label-discharging = " %percentage%% "
label-discharging-foreground = ${colors.foreground}
label-discharging-underline = ${colors.green}

format-full = <ramp-capacity><label-full>
label-full = " %percentage%% "
label-full-foreground = ${colors.foreground}
label-full-underline = ${colors.green}

ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰁹
ramp-capacity-font = 5
ramp-capacity-padding = 1
ramp-capacity-foreground = ${vars.prefix-fg}
ramp-capacity-background = ${vars.prefix-bg}

animation-charging-0 = 󰢜
animation-charging-1 = 󰂆
animation-charging-2 = 󰂈
animation-charging-3 = 󰂊
animation-charging-4 = 󰂅
animation-charging-font = 5
animation-charging-padding = 1
animation-charging-framerate = 750
animation-charging-foreground = ${vars.prefix-fg}
animation-charging-background = ${vars.prefix-bg}

[module/backlight]
type = internal/backlight
card = ${env:BACKLIGHT_CARD:intel_backlight}
use-actual-brightness = true
enable-scroll = true
format = <label>
format-prefix = ${vars.icon-light}
format-prefix-font = 5
format-prefix-padding = 1
format-prefix-foreground = ${vars.prefix-fg}
format-prefix-background = ${vars.prefix-bg}
label = " %percentage%% "
label-foreground=${colors.foreground}
label-underline = ${colors.green}


[module/help-keys]
type = custom/text
format = " Keys "
format-font = 5
format-foreground = ${vars.prefix-fg}
format-background = ${vars.prefix-bg}
format-underline = ${colors.primary}
click-left = bash $dots_cmd $current_env show_cheatsheet.sh
