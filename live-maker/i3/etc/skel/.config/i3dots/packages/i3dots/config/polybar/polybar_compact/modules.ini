[compact-base]
format-underline = ${vars.compact-background}
format-overline = ${vars.compact-background}

[module/rofi]
inherit = compact-base
type=custom/text
format=${vars.launcher-icon-raw}
format-font = 5
format-padding = ${vars.icon-padding}
format-foreground=${colors.background-solid}
format-background=${colors.primary}
click-left= bash ~/.config/rofi/bin/launch.sh
click-right= bash $dots_cmd $current_env powermenu

[module/ss]
type=custom/text
format= 
format-background=${vars.background}

[module/i3]
inherit = compact-base
type = internal/i3
enable-scroll = false
show-urgent = true
strip-wsnumbers = false
index-sort = true
enable-click = true
fuzzy-match = true

format = <label-state> <label-mode>
label-mode = %mode%
label-mode-padding = 4px
label-mode-background = ${colors.red} 
label-mode-foreground = ${colors.white0}

label-focused = "  %name%  "
label-focused-foreground = ${colors.surface}
label-focused-background= ${colors.primary}

label-unfocused = " %name% "
label-unfocused-foreground = ${colors.surface}
label-unfocused-background= ${colors.secondary}

label-visible = " %name% "
label-visible-foreground = ${colors.surface}
label-visible-background = ${colors.secondary}

label-urgent = " %name% "
label-urgent-foreground = ${colors.surface}
label-urgent-background= ${colors.red}

label-separator = %{O2px}
label-separator-background = ${vars.compact-background}

[module/xwindow]
inherit = compact-base
type = internal/xwindow
format-prefix = " 󰍹 "
format-prefix-font = 5
format-prefix-foreground = ${colors.surface}
format-prefix-background = ${colors.green}
label = " %class% "
label-maxlen = 60
label-foreground = ${colors.surface}
label-background = ${colors.secondary}
label-empty = " Escritorio "
label-empty-foreground = ${colors.surface}
label-empty-background = ${colors.secondary}

[module/time]
inherit = compact-base
type = custom/text
format = ${vars.icon-date}
format-font = 5
format-padding = ${vars.icon-padding}
format-foreground = ${colors.surface}
format-background = ${colors.primary}
click-left = #time-value.module_toggle

[module/time-value]
inherit = compact-base
hidden = ${env:COMP_MODULES_HIDDEN:true}
type = internal/date
interval = 1
date = %H:%M
date-alt = %A %d %b | %H:%M
label = " %date% "
label-foreground = ${colors.surface}
label-background = ${colors.secondary}

[module/space]
type = custom/text
format = "  "

[module/filesystem]
inherit = compact-base
type = custom/text
format = ${vars.icon-disk}
format-font = 5
format-padding = ${vars.icon-padding}
format-foreground = ${colors.surface}
format-background = ${colors.green}
click-left = #filesystem-value.module_toggle

[module/filesystem-value]
inherit = compact-base
hidden = ${env:COMP_MODULES_HIDDEN:true}
type = internal/fs
interval = 2
mount-0 = /
format-mounted = <label-mounted>
format-mounted-underline = ${vars.compact-background}
format-mounted-overline = ${vars.compact-background}
label-mounted = " %free% "
label-mounted-foreground = ${colors.surface}
label-mounted-background = ${colors.secondary}

[module/cpu]
inherit = compact-base
type = custom/text
format = ${vars.icon-cpu}
format-font = 5
format-padding = ${vars.icon-padding}
format-foreground = ${colors.surface}
format-background = ${colors.green}
click-left = #cpu-value.module_toggle

[module/cpu-value]
inherit = compact-base
hidden = ${env:COMP_MODULES_HIDDEN:true}
type = internal/cpu
interval = 1
format = <label>
label = " %percentage%% "
label-foreground = ${colors.surface}
label-background = ${colors.secondary}

[module/temp]
inherit = compact-base
type = internal/temperature
interval = 0.5
hwmon-path = ${env:HWMON_PATH}
base-temperature = 20 
warn-temperature = 70
units = true

format = <label>
label = " %{A1:#temp-value.module_toggle:}%{A} "
label-font = 5
label-foreground = ${colors.surface}
label-background = ${colors.green}

format-warn = <label-warn>
format-warn-underline = ${vars.compact-background}
format-warn-overline = ${vars.compact-background}
label-warn = " %{A1:#temp-value.module_toggle:}%{A} "
label-warn-font = 5
label-warn-foreground = ${colors.surface}
label-warn-background = ${colors.red}

[module/temp-value]
inherit = compact-base
hidden = ${env:COMP_MODULES_HIDDEN:true}
type = internal/temperature
interval = 0.5
hwmon-path = ${env:HWMON_PATH}
base-temperature = 20 
warn-temperature = 70
units = true
format = <label>
label = " %temperature-c% "
label-foreground = ${colors.surface}
label-background = ${colors.secondary}
format-warn = <label-warn>
format-warn-underline = ${vars.compact-background}
format-warn-overline = ${vars.compact-background}
label-warn = " %temperature-c% "
label-warn-foreground = ${colors.surface}
label-warn-background = ${colors.secondary}

[module/memory]
inherit = compact-base
type = custom/text
format = ${vars.icon-ram}
format-font = 5
format-padding = ${vars.icon-padding}
format-foreground = ${colors.surface}
format-background = ${colors.green}
click-left = #memory-value.module_toggle

[module/memory-value]
inherit = compact-base
hidden = ${env:COMP_MODULES_HIDDEN:true}
type = internal/memory
interval = 1 
format = <label>
label = " %mb_used% "
label-foreground = ${colors.surface}
label-background = ${colors.secondary}

[module/pulseaudio]
inherit = compact-base
type = custom/text
format = ${vars.icon-vol}
format-font = 5
format-padding = ${vars.icon-padding}
format-foreground = ${colors.surface}
format-background = ${colors.green}
click-left = #pulseaudio-value.module_toggle
click-right = ~/.local/bin/sys_control.sh mute
scroll-up = ~/.local/bin/sys_control.sh volume +5%
scroll-down = ~/.local/bin/sys_control.sh volume -5%

[module/pulseaudio-value]
inherit = compact-base
hidden = ${env:COMP_MODULES_HIDDEN:true}
type = internal/pulseaudio
format-volume = <label-volume>
format-volume-underline = ${vars.compact-background}
format-volume-overline = ${vars.compact-background}
label-volume = " %percentage%% "
label-volume-foreground = ${colors.surface}
label-volume-background = ${colors.secondary}
format-muted = <label-muted>
format-muted-underline = ${vars.compact-background}
format-muted-overline = ${vars.compact-background}
label-muted = " muted "
label-muted-foreground = ${colors.surface}
label-muted-background = ${colors.secondary}

[module/tray]
inherit = compact-base
type=internal/tray
format = <tray>
tray-size = 70%
tray-spacing= 10px
format-padding = 8px
format-background=${colors.background-solid}
tray-background = ${colors.background-solid}

[module/battery]
inherit = compact-base
type = internal/battery
full-at = 99
low-at = 15
battery = ${env:BAR_BATTERY:BAT0}
adapter = ${env:BAR_ADAPTER:AC}
poll-interval = 5

format-charging = %{A1:#battery-value.module_toggle:}<animation-charging>%{A}
format-charging-underline = ${vars.compact-background}
format-charging-overline = ${vars.compact-background}
format-discharging = %{A1:#battery-value.module_toggle:}<ramp-capacity>%{A}
format-discharging-underline = ${vars.compact-background}
format-discharging-overline = ${vars.compact-background}

format-full = %{A1:#battery-value.module_toggle:}<label-full>%{A}
format-full-underline = ${vars.compact-background}
format-full-overline = ${vars.compact-background}
label-full = 
label-full-font = 5
label-full-padding = ${vars.icon-padding}
label-full-foreground = ${colors.surface}
label-full-background = ${colors.green}

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-font = 5
ramp-capacity-padding = ${vars.icon-padding}
ramp-capacity-foreground = ${colors.surface}
ramp-capacity-background = ${colors.green}

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-font = 5
animation-charging-padding = ${vars.icon-padding}
animation-charging-framerate = 750
animation-charging-foreground = ${colors.surface}
animation-charging-background = ${colors.green}

[module/battery-value]
inherit = compact-base
hidden = ${env:COMP_MODULES_HIDDEN:true}
type = internal/battery
full-at = 99
low-at = 15
battery = ${env:BAR_BATTERY:BAT0}
adapter = ${env:BAR_ADAPTER:AC}
poll-interval = 5

format-charging = <label-charging>
format-charging-underline = ${vars.compact-background}
format-charging-overline = ${vars.compact-background}
label-charging = " %percentage%% "
label-charging-foreground = ${colors.surface}
label-charging-background = ${colors.secondary}

format-discharging = <label-discharging>
format-discharging-underline = ${vars.compact-background}
format-discharging-overline = ${vars.compact-background}
label-discharging = " %percentage%% "
label-discharging-foreground = ${colors.surface}
label-discharging-background = ${colors.secondary}

format-full = <label-full>
format-full-underline = ${vars.compact-background}
format-full-overline = ${vars.compact-background}
label-full = " %percentage%% "
label-full-foreground = ${colors.surface}
label-full-background = ${colors.secondary}

[module/backlight]
inherit = compact-base
type = custom/text
format = ${vars.icon-light}
format-font = 5
format-padding = ${vars.icon-padding}
format-foreground = ${colors.surface}
format-background = ${colors.green}
click-left = #backlight-value.module_toggle
scroll-up = ~/.local/bin/sys_control.sh brightness +5%
scroll-down = ~/.local/bin/sys_control.sh brightness 5%-

[module/backlight-value]
inherit = compact-base
hidden = ${env:COMP_MODULES_HIDDEN:true}
type = internal/backlight
card = ${env:BACKLIGHT_CARD:intel_backlight}
use-actual-brightness = true
format = <label>
label = " %percentage%% "
label-foreground = ${colors.surface}
label-background = ${colors.secondary}


[module/help-keys]
inherit = compact-base
type = custom/text
format = " Keys "
format-foreground = ${colors.foreground}
format-background = ${colors.background-solid}
click-left = bash $dots_cmd $current_env show_cheatsheet.sh
