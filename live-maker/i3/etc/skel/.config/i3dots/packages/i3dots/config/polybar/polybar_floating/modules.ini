[module/rofi]
type=custom/text
format=${vars.launcher-icon-raw}
format-font = 5
format-padding = ${vars.icon-padding}
format-foreground=${colors.background-solid}
format-background=${colors.primary}
click-left= bash ~/.config/rofi/bin/launch.sh
click-right= bash $dots_cmd $current_env powermenu

[module/ss]
type=custom/text
format= 
format-background=${vars.background}

[module/i3]
type = internal/i3
enable-scroll = false
show-urgent = true
strip-wsnumbers = false
index-sort = true
enable-click = true
fuzzy-match = true

format = <label-state> <label-mode>
label-mode = %mode%
label-mode-padding = 4px
label-mode-background = ${colors.red} 
label-mode-foreground = ${colors.white0}

label-focused = %name%
label-focused-foreground = ${colors.background-solid}
label-focused-background= ${colors.primary}
label-focused-padding = 12px

label-unfocused = %name%
label-unfocused-foreground = ${colors.foreground}
label-unfocused-background= ${colors.background-alt}
label-unfocused-padding = 8px

label-visible = %name%
label-visible-background = ${colors.background-alt}
label-visible-padding = 8px

label-urgent = %name%
label-urgent-foreground = ${colors.background-solid}
label-urgent-background= ${colors.red}
label-urgent-padding = 8px

label-separator = %{O2px}
label-separator-background = ${vars.background}

[module/xwindow]
type = internal/xwindow
format-prefix=󰍹
format-prefix-font = 5
format-prefix-padding = ${vars.icon-padding}
format-prefix-foreground=${colors.background-solid}
format-prefix-background=${colors.green}
label = %class%
label-padding = 4px
label-maxlen=60
label-foreground = ${colors.foreground}
label-background= ${colors.background-solid}

[module/time]
type = internal/date
interval = 1
format-prefix = ${vars.icon-date}
format-prefix-font = 5
format-prefix-padding = ${vars.icon-padding}
format-prefix-foreground=${colors.background-solid}
format-prefix-background=${colors.primary}
date = %A %d %b | %H:%M
label = %date% 
label-padding = 4px
label-foreground = ${colors.foreground}
label-background= ${colors.background-solid}

[module/filesystem]
type = internal/fs
interval = 2
mount-0 = /
format-mounted-prefix = ${vars.icon-disk}
format-mounted-prefix-font = 5
format-mounted-prefix-padding = ${vars.icon-padding}
format-mounted-prefix-foreground = ${colors.background-solid}
format-mounted-prefix-background= ${colors.green}
label-mounted = %free%
label-mounted-padding = 4px
label-mounted-foreground = ${colors.foreground}
label-mounted-background= ${colors.background-solid}

[module/cpu]
type = internal/cpu
interval = 1
format-prefix = ${vars.icon-cpu}
format-prefix-font = 5
format-prefix-padding = ${vars.icon-padding}
format-prefix-foreground = ${colors.background-solid}
format-prefix-background= ${colors.green}
label = %percentage%%
label-padding = 4px
label-foreground = ${colors.foreground}
label-background= ${colors.background-solid}

[module/temp]
type = internal/temperature
interval = 0.5
hwmon-path = ${env:HWMON_PATH}
base-temperature = 20 
warn-temperature = 70
units = true
format = <label>
format-prefix = ${vars.icon-temp}
format-prefix-font = 5
format-prefix-padding = ${vars.icon-padding}
format-prefix-foreground= ${colors.background-solid}
format-prefix-background= ${colors.green}
label = %temperature-c%
label-padding = 4px
label-foreground = ${colors.foreground}
label-background= ${colors.background-solid}

format-warn = <label-warn>
format-warn-prefix = ${vars.icon-temp}
format-warn-prefix-font = 5
format-warn-prefix-padding = ${vars.icon-padding}
format-warn-prefix-foreground = ${colors.background-solid}
format-warn-prefix-background = ${colors.red}
label-warn = %temperature-c%
label-warn-padding = 4px
label-warn-foreground = ${colors.red}
label-warn-background = ${colors.background-solid}

[module/memory]
type = internal/memory
interval = 1 
format-prefix = ${vars.icon-ram}
format-prefix-font = 5
format-prefix-padding = ${vars.icon-padding}
format-prefix-foreground = ${colors.background-solid}
format-prefix-background= ${colors.green}
label = %mb_used%
label-padding = 4px
label-foreground = ${colors.foreground}
label-background= ${colors.background-solid}

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = ${vars.icon-vol}
format-volume-prefix-font = 5
format-volume-prefix-padding = ${vars.icon-padding}
format-volume-prefix-foreground = ${colors.background-solid}
format-volume-prefix-background= ${colors.green}
format-volume = <label-volume>
label-volume = %percentage%%
label-volume-padding = 4px
label-volume-foreground= ${colors.foreground}
label-volume-background= ${colors.background-solid}

format-muted-prefix = 
format-muted-prefix-font = 5
format-muted-prefix-padding = ${vars.icon-padding}
format-muted-prefix-foreground = ${colors.background-solid}
format-muted-background = ${colors.orange}
label-muted = muted
label-muted-padding = 4px
label-muted-foreground = ${colors.orange}
label-muted-background = ${colors.background-solid}

[module/tray]
type=internal/tray
format = <tray>
tray-size = 70%
tray-spacing= 10px
format-padding = 4px
format-background=${colors.background-solid}
tray-background = ${colors.background-solid}

[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = ${env:BAR_BATTERY:BAT0}
adapter = ${env:BAR_ADAPTER:AC}
poll-interval = 5

format-charging = <animation-charging><label-charging>
label-charging = %percentage%%
label-charging-padding = 4px
label-charging-foreground = ${colors.foreground}
label-charging-background = ${colors.background-solid}

format-discharging = <ramp-capacity><label-discharging>
label-discharging = %percentage%%
label-discharging-padding = 4px
label-discharging-foreground = ${colors.foreground}
label-discharging-background = ${colors.background-solid}

format-full-prefix = 
format-full-prefix-font = 5
format-full-prefix-padding = ${vars.icon-padding}
format-full-foreground = ${colors.background-solid}
format-full-background = ${colors.green}
label-full = %percentage%%
label-full-padding = 4px
label-full-foreground = ${colors.foreground}
label-full-background = ${colors.background-solid}

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-font = 5
ramp-capacity-padding = ${vars.icon-padding}
ramp-capacity-foreground = ${colors.background-solid}
ramp-capacity-background = ${colors.green}

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-font = 5
animation-charging-padding = ${vars.icon-padding}
animation-charging-framerate = 750
animation-charging-foreground = ${colors.background-solid}
animation-charging-background = ${colors.green}

[module/backlight]
type = internal/backlight
card = ${env:BACKLIGHT_CARD:intel_backlight}
use-actual-brightness = true
enable-scroll = true
format = <label>
format-prefix = ${vars.icon-light}
format-prefix-font = 5
format-prefix-padding = ${vars.icon-padding}
format-prefix-foreground = ${colors.background-solid}
format-prefix-background = ${colors.green}
label = %percentage%%
label-padding = 4px
label-foreground=${colors.foreground}
label-background=${colors.background-solid}



[module/help-keys]
type = custom/text
format = " Keys "
format-foreground = ${colors.foreground}
format-background = ${colors.background-solid}
click-left = bash $dots_cmd $current_env show_cheatsheet.sh

