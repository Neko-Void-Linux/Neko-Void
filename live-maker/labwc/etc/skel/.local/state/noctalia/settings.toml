config_version = 13

[audio]
enable_overdrive = true
enable_sounds = true

[bar]
order = [ "default" ]

    [bar.default]
    border_width = 2.0
    capsule_radius = 0
    center = []
    contact_shadow = true
    end = [
        "media",
        "tray",
        "notifications",
        "Updater",
        "clipboard",
        "recorder",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "battery",
        "clock",
        "control-center",
        "session"
    ]
    font_scale = 1.0999999828636646
    margin_ends = 0
    padding = 16
    position = "bottom"
    radius = 0
    start = [ "launcher", "workspaces", "spacer_2", "taskbar" ]
    thickness = 42

[control_center]
sidebar_section = "none"
width = 650

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
background_opacity = 0.99999997764825821
icon_size = 42
radius = 0

[hot_corners]
delay_ms = 500
enabled = true

    [hot_corners.top_left]
    action = "launcher"

[keybinds]
validate = [ "Return", "KP_Enter" ]

