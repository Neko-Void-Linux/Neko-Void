[plugin_settings."noctalia/screen_recorder"]
directory = ""

[plugins]
enabled = [ "noctalia/translator", "noctalia/wallhaven", "noctalia/screen_recorder" ]

[shell]
corner_radius_scale = 0.0
font_family = "CozetteVector"
password_style = "random"
polkit_agent = true
settings_show_advanced = false

    [shell.animation]
    speed = 0.70000001043081284

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    show_app_actions = true

    [shell.panel]
    launcher_placement = "attached"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_wallpaper = true

    [shell.screen_corners]
    size = 79

[theme]
builtin = "Gruvbox"
community_palette = "Cream"
custom_palette = "4-ts"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "foot", "gtk3", "gtk4", "labwc", "qt" ]
    community_ids = [ "discord" ]

[wallpaper]
directory = "/usr/share/wallpapers"
directory_dark = "/usr/share/wallpapers"

    [wallpaper.default]
    path = "/usr/share/wallpapers/moony-art3.png"

    [wallpaper.last]
    path = "/usr/share/wallpapers/moony-art3.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/usr/share/wallpapers/moony-art3.png"

    [wallpaper.monitors.VGA-1]
    path = "/usr/share/wallpapers/moony-art3.png"

    [wallpaper.monitors.Virtual-1]
    path = "/usr/share/wallpapers/moony-art3.png"

[widget.Updater]
glyph = "reload"
tooltip = "Reloader"
type = "custom_button"

    [widget.Updater.actions]
    left = "exec labwc --reconfigure"
    right = "config-reload"

[widget.media]
album_art_only = true
hide_when_no_media = true

[widget.network]
show_label = false

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.spacer_2]
type = "spacer"

[widget.taskbar]
show_window_title = true

[widget.tray]
drawer = true

[widget.volume]
show_label = false