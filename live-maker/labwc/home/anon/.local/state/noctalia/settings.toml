config_version = 13

[bar.default]
background_opacity = 0.93999997898936272
capsule_radius = 0
center = []
end = [
    "media",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "clock",
    "control-center",
    "session"
]
font_weight = 400
margin_edge = 3
margin_ends = 5
padding = 16
position = "bottom"
radius = 0
start = [ "launcher", "wallpaper", "workspaces", "spacer_2", "taskbar" ]
thickness = 32

[dock]
cross_axis_padding = 7
radius = 0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@Virtual-1", "lockscreen-login-box@VGA-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@VGA-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 640.0
    cy = 645.0
    output = "VGA-1"
    placement_height = 0.0
    placement_width = 0.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@VGA-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 507.0
    cy = 492.0
    output = "Virtual-1"
    placement_height = 674.0
    placement_width = 1014.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."noctalia/screen_recorder"]
directory = ""

[plugins]
enabled = [ "noctalia/screen_recorder", "noctalia/translator" ]

[shell]
corner_radius_scale = 0.0
polkit_agent = true

    [shell.launcher.providers.windows]
    prefix = ""

    [shell.panel]
    launcher_placement = "attached"
    open_near_click_launcher = true

    [shell.screen_corners]
    size = 1

    [shell.screenshot]
    confirm_region = true
    directory = "/home/javierc/Imágenes/Screenshots"

[theme]
community_palette = "Cream"
custom_palette = "4-ts"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "cava", "foot", "gtk3", "gtk4", "kitty", "labwc", "qt" ]

[wallpaper]
directory = "/home/javierc/Imágenes/Wallpapers/OTAKU WALLPAPERS"
directory_dark = "/usr/share/wallpapers"

    [wallpaper.default]
    path = "/usr/share/wallpapers/moony-art3.png"

    [wallpaper.last]
    path = "/usr/share/wallpapers/moony-art3.png"

    [wallpaper.monitors.VGA-1]
    path = "/usr/share/wallpapers/moony-art3.png"

    [wallpaper.monitors.Virtual-1]
    path = "/usr/share/wallpapers/moony-art3.png"

    [[wallpaper.favorite]]
    path = "/home/javierc/Imágenes/Wallpapers/OTAKU WALLPAPERS/wallpaper-theme-converter(5).png"
    theme_mode = "auto"

[widget.media]
enabled = false

[widget.network]
show_label = false

[widget.spacer_2]
type = "spacer"

[widget.taskbar]
scale = 1.2

[widget.volume]
show_label = false
