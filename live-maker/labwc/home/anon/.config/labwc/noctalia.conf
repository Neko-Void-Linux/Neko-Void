# window border
window.active.border.color: #cdc6b2
window.inactive.border.color: #cbc6bc

# ToggleKeybinds status indicator
window.active.indicator.toggled-keybind.color: #ffb4ab

# window titlebar background
window.active.title.bg.color: #cdc6b2
window.inactive.title.bg.color: #cbc6bc

window.active.label.text.color: #343022
window.inactive.label.text.color: #32302a
window.label.text.justify: center

# window button hover overlay
window.button.hover.bg.color: #2b2a28

# window buttons
window.active.button.unpressed.image.color: #343022
window.inactive.button.unpressed.image.color: #343022

# menu
menu.border.color: #343022
menu.items.bg.color: #cdc6b2
menu.items.text.color: #343022
menu.items.active.bg.color: #cbc6bc
menu.items.active.text.color: #32302a
menu.separator.color: #343022
menu.title.bg.color: #cdc6b2
menu.title.text.color: #343022

# on screen display (window-cycle dialog)
osd.bg.color: #cdc6b2
osd.border.color: #343022
osd.label.text.color: #343022
osd.window-switcher.preview.border.color: #959086
