[plugin_settings."imjustdoingmypart/niri-animations"]
docked_placement = "floating"
presets_dir = "~/.config/niri/animations/"

[plugin_settings."noctalia/screen_recorder"]
directory = ""

[plugin_settings."umedbazarov/layout-fix"]
dictionaries = "install"

[plugins]
enabled = [ "noctalia/translator", "noctalia/screen_recorder" ]

[shell]
corner_radius_scale = 0.0
font_family = "CozetteVector"
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true

    [shell.animation]
    speed = 0.70000001043081284

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    compact = true
    show_app_actions = true

    [shell.panel]
    clipboard_placement = "attached"
    control_center_position = "center"
    floating_offset = 0
    launcher_placement = "attached"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_wallpaper = true
    polkit_placement = "attached"
    session_placement = "floating"
    transparency_mode = "soft"
    wallpaper_position = "center"

    [shell.screen_corners]
    size = 79

    [shell.shadow]
    alpha = 0.45999998971819878
    direction = "center"

[theme]
builtin = "Gruvbox"
community_palette = "Matecito"
custom_palette = "4-ts"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "cava", "foot", "gtk3", "gtk4", "kitty", "niri", "qt" ]

[wallpaper]
directory = "/usr/share/wallpapers"
directory_dark = "/usr/share/wallpapers"

    [wallpaper.default]
    path = "/usr/share/wallpapers/Moony-art.png"

    [wallpaper.last]
    path = "/usr/share/wallpapers/Moony-art.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/usr/share/wallpapers/Moony-art.png"

    [wallpaper.monitors.VGA-1]
    path = "/usr/share/wallpapers/moony-art3.png"

    [wallpaper.monitors.Virtual-1]
    path = "/usr/share/wallpapers/moony-art3.png"

[widget.audio_visualizer]
bands = 56
show_when_idle = true
width = 150

[widget.media]
album_art_only = true
hide_when_no_media = true

[widget.network]
show_label = false

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.taskbar]
show_window_title = true

[widget.tray]
drawer = true

[widget.volume]
show_label = false