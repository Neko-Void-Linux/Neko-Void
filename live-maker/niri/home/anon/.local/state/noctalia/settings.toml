config_version = 13

[audio]
enable_overdrive = true
enable_sounds = true

[backdrop]
enabled = true
tint_intensity = 0.099999997764825821

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.89999997988343239
    capsule_fill = "on_secondary"
    capsule_radius = 0
    center = [ "audio_visualizer" ]
    contact_shadow = true
    end = [
        "media",
        "tray",
        "notifications",
        "clipboard",
        "recorder",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "battery",
        "clock",
        "control-center",
        "session"
    ]
    font_weight = 400
    margin_edge = 5
    margin_ends = 16
    padding = 30
    radius = 0
    thickness = 42

[control_center]
show_session_button = false
sidebar = "full"
sidebar_section = "none"
width = 800

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
enabled = true
icon_size = 32
main_axis_padding = 10
radius = 0
reserve_space = false
show_dots = true
smart_auto_hide = true

[hot_corners]
delay_ms = 500
enabled = true

[keybinds]
validate = [ "Return", "KP_Enter" ]

